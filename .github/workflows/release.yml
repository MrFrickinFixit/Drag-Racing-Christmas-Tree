name: Build and release Practice Tree

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example, 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { throw 'Invalid version' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Test, publish, and compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./installer/build.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: PracticeTree-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/v${{ steps.version.outputs.value }}/*-Setup.exe
            artifacts/v${{ steps.version.outputs.value }}/*.zip
            artifacts/v${{ steps.version.outputs.value }}/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:APP_VERSION"
          $dir = "artifacts/v$env:APP_VERSION"
          $assets = @((Join-Path $dir "PracticeTree-$env:APP_VERSION-win-x64-Setup.exe"), (Join-Path $dir "PracticeTree-$env:APP_VERSION-win-x64.zip"), (Join-Path $dir 'SHA256SUMS.txt'))
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; no assets were overwritten." }
          $arguments = @('release', 'create', $tag) + $assets + @('--target', $env:GITHUB_SHA, '--title', "Practice Tree $env:APP_VERSION", '--notes-file', 'installer/RELEASE_NOTES.md')
          if ($env:APP_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
